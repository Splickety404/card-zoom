<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Zoom</title>
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --panel-2: #1f232c; --line: #2c313c;
  --text: #e8eaef; --muted: #9aa1ad; --accent: #7c9cff; --accent-2: #3d5afe; --sel: #ffd166;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f5f8; --panel: #ffffff; --panel-2: #eef0f4; --line: #d8dce4;
    --text: #1b1e25; --muted: #5d6573; --accent: #3d5afe; --accent-2: #2a44d8; --sel: #e09f00; color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
button, input { font: inherit; color: inherit; }
button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
input[type=url] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }

header { display: flex; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
header #url { flex: 1 1 320px; }
#status { color: var(--muted); font-size: 12px; padding: 4px 16px 0; min-height: 1.4em; }
button.nudge { background: var(--accent-2); border-color: var(--accent-2); color: #fff; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { box-shadow: 0 0 0 6px rgba(124,156,255,.35); } }

#stageWrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 16px 16px; min-height: 0; }
#stage { position: relative; width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; overflow: hidden; }
#stage iframe, #stage video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: contain; }
#media { position: absolute; inset: 0; isolation: isolate; transform-style: flat; }
#empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #9aa1ad; text-align: center; padding: 24px; }

/* Each recognised card: its official scan drawn where the card lies on the table. */
#marks { position: absolute; inset: 0; pointer-events: none; }
.mark { position: absolute; pointer-events: auto; transition: left .3s linear, top .3s linear, width .3s linear, height .3s linear; }
.mark img { position: absolute; border-radius: 4.5% / 3.2%; box-shadow: 0 1px 6px rgba(0,0,0,.5); pointer-events: none; }
.mark.debug { border: 2px dashed var(--sel); border-radius: 4px; }
.mark.debug[data-near]::after { content: attr(data-near); position: absolute; left: 0; top: 100%; font-size: 10px; line-height: 1.2; white-space: nowrap;
  background: rgba(0,0,0,.75); color: #ffd166; padding: 1px 3px; pointer-events: none; }
.mark .nc { position: absolute; top: -9px; right: -9px; width: 18px; height: 18px; padding: 0; border-radius: 50%; font-size: 12px; line-height: 16px;
  background: var(--panel); color: var(--text); display: none; z-index: 1; }
.mark:hover .nc { display: block; }
/* Hovering a card shows it upright at a readable size beside it. */
#pop { position: absolute; display: none; pointer-events: none; z-index: 5; border-radius: 3.5% / 2.5%; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
#pop.open { display: block; }
@media (prefers-reduced-motion: reduce) { .mark { transition: none; } button.nudge { animation: none; } }
@media (max-width: 860px) { #stageWrap { padding: 8px 16px; } }
</style>
</head>
<body>
<header>
  <h1>Card Zoom</h1>
  <input id="url" type="url" placeholder="Paste a YouTube or Twitch link, or a direct video URL" autocomplete="off">
  <button id="load" class="primary">Load</button>
  <button id="capture" title="Let the page see the stream's pixels (needed for YouTube and Twitch)">Start capture</button>
  <input id="file" type="file" accept="video/*" hidden><button id="fileBtn" type="button">Open video file</button>
</header>
<div id="status">Load a stream to begin.</div>
<div id="stageWrap">
  <div id="stage">
    <div id="empty">
      <div style="font-size:15px;color:#e8eaef">Paste a stream link above</div>
      <div>Then press <b>Start capture</b> and choose <b>this tab</b>. Recognised cards appear sharp in place; hover one to read it.</div>
    </div>
    <div id="media"></div>
    <div id="marks"></div>
    <img id="pop" alt="">
  </div>
</div>

<script>
// ---- core/zoom.js ----
// Card Zoom core: maps a selection to video pixels and renders an enlarged, cleaned-up crop.
// No DOM lookups or page state here, so the same file can run in a web page, an extension
// content script, or an app webview. Exposes window.CardZoom.zoom.
(function (root) {
  'use strict';

  function clampRect(x, y, w, h, vw, vh) {
    x = Math.max(0, Math.min(x, vw - 1)); y = Math.max(0, Math.min(y, vh - 1));
    return { x, y, w: Math.max(1, Math.min(w, vw - x)), h: Math.max(1, Math.min(h, vh - y)) };
  }

  // sel: {x,y,w,h} as fractions of the element the user dragged over (the "stage").
  // frame: how the video frame relates to that element:
  //   'contain'  - the frame is drawn inside the stage with object-fit: contain (a <video>)
  //   'stage'    - the frame is exactly the stage (tab capture cropped to the stage)
  //   'viewport' - the frame is the whole browser viewport (uncropped tab capture)
  // stageRect: the stage's getBoundingClientRect(); viewport: {width, height} in CSS px.
  function mapSelection({ sel, videoW: vw, videoH: vh, frame, stageRect: r, viewport }) {
    if (!vw || !vh) return null;
    if (frame === 'stage') return clampRect(sel.x * vw, sel.y * vh, sel.w * vw, sel.h * vh, vw, vh);
    if (frame === 'contain') {
      const scale = Math.min(r.width / vw, r.height / vh);
      const ox = (r.width - vw * scale) / 2, oy = (r.height - vh * scale) / 2;
      return clampRect((sel.x * r.width - ox) / scale, (sel.y * r.height - oy) / scale,
        sel.w * r.width / scale, sel.h * r.height / scale, vw, vh);
    }
    const kx = vw / viewport.width, ky = vh / viewport.height;
    return clampRect((r.left + sel.x * r.width) * kx, (r.top + sel.y * r.height) * ky,
      sel.w * r.width * kx, sel.h * r.height * ky, vw, vh);
  }

  // A click instead of a drag: a card-shaped (63:88) box centred on the point.
  function clickToSelection(px, py, stageW, stageH, heightFrac = 0.22) {
    const h = stageH * heightFrac, w = h * 63 / 88;
    return { x: px - w / 2, y: py - h / 2, w, h };
  }

  // Unsharp mask: out = src + amount * (src - blur(src)), 3x3 box blur.
  function sharpen(ctx, w, h, amount = 0.6) {
    const img = ctx.getImageData(0, 0, w, h), d = img.data, src = new Uint8ClampedArray(d);
    const W = w * 4;
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = y * W + x * 4;
        for (let c = 0; c < 3; c++) {
          const k = i + c;
          const blur = (src[k - W - 4] + src[k - W] + src[k - W + 4] + src[k - 4] + src[k] + src[k + 4] +
            src[k + W - 4] + src[k + W] + src[k + W + 4]) / 9;
          d[k] = src[k] + amount * (src[k] - blur);
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  const work = typeof document !== 'undefined' ? document.createElement('canvas') : new OffscreenCanvas(1, 1);

  // Draws rect of source (video, canvas or image) into out, scaled to fit maxW x maxH device px
  // but never less than minScale. Throws if the source is cross-origin and unreadable.
  function renderCrop(source, rect, out, { maxW, maxH, minScale = 3, rotate = false, sharpen: sh = true, contrast = false } = {}) {
    const sw = rotate ? rect.h : rect.w, sh2 = rotate ? rect.w : rect.h;
    const fit = Math.max(minScale, Math.min(maxW / sw, maxH / sh2));
    const outW = Math.round(sw * fit), outH = Math.round(sh2 * fit);

    // Two-step upscale (source -> 2x -> final) looks smoother than one big jump.
    work.width = Math.round(rect.w * 2); work.height = Math.round(rect.h * 2);
    const wctx = work.getContext('2d');
    wctx.imageSmoothingEnabled = true; wctx.imageSmoothingQuality = 'high';
    wctx.drawImage(source, rect.x, rect.y, rect.w, rect.h, 0, 0, work.width, work.height);

    out.width = outW; out.height = outH;
    const ctx = out.getContext('2d', { willReadFrequently: true });
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    if (contrast) ctx.filter = 'contrast(1.25) saturate(1.15)';
    // Turn counter-clockwise: tapped cards are turned clockwise, so this stands them upright.
    if (rotate) { ctx.translate(0, outH); ctx.rotate(-Math.PI / 2); ctx.drawImage(work, 0, 0, outH, outW); }
    else ctx.drawImage(work, 0, 0, outW, outH);
    ctx.restore();
    if (sh) sharpen(ctx, outW, outH);
    return { width: outW, height: outH };
  }

  // Most TCGs print the name in the top band of the card: grayscale, high-contrast copy of it for OCR.
  function nameBand(card) {
    const band = typeof document !== 'undefined' ? document.createElement('canvas') : new OffscreenCanvas(1, 1);
    const bh = Math.round(card.height * 0.14);
    band.width = card.width; band.height = bh;
    const b = band.getContext('2d');
    b.filter = 'grayscale(1) contrast(1.6)';
    b.drawImage(card, 0, Math.round(card.height * 0.02), card.width, bh, 0, 0, card.width, bh);
    return band;
  }

  root.CardZoom = root.CardZoom || {};
  root.CardZoom.zoom = { mapSelection, clickToSelection, renderCrop, sharpen, nameBand, clampRect };
})(typeof window !== 'undefined' ? window : self);

</script>
<script>
// ---- core/detect.js ----
// Card Zoom core: finds card-shaped rectangles in a video frame, with no ML model or library.
// Method: Sobel edges on a frame scaled to 800 px wide -> connected edge blobs -> keep blobs whose bounding
// box has a trading card's proportions (63x88 mm, upright or tapped), whose four sides are
// mostly edge pixels, and which has straight rules across its face (name bar, art box, text box). A tracker smooths results across frames so boxes don't flicker.
// Exposes window.CardZoom.detect.
(function (root) {
  'use strict';

  const CARD = 63 / 88; // width / height of standard TCG cards (Magic, Pokémon, Lorcana, ~Yu-Gi-Oh)
  const mk = (w, h) => {
    const c = typeof document !== 'undefined' ? document.createElement('canvas') : new OffscreenCanvas(w, h);
    c.width = w; c.height = h; return c;
  };
  let buf = null;

  // source: video/canvas/image. region: {x,y,w,h} in source pixels to search (default: all).
  // Returns [{x,y,w,h,score,rotated}] in source pixels, best first.
  function detectCards(source, region, opts = {}) {
    const sw = source.videoWidth || source.width, sh = source.videoHeight || source.height;
    region = region || { x: 0, y: 0, w: sw, h: sh };
    const {
      analysisWidth = 800, minHeightFrac = 0.05, maxHeightFrac = 0.95,
      aspectTolerance = 0.25, // loose enough for a camera looking at the table at an angle
      minSideEdge = 0.5, minMeanSideEdge = 0.7, minInnerLines = 2, scanMinSide = 0.6, scanMinMean = 0.78,
    } = opts;
    const W = Math.min(analysisWidth, Math.round(region.w)), H = Math.round(region.h * W / region.w);
    if (W < 32 || H < 32) return [];
    if (!buf || buf.width !== W || buf.height !== H) buf = mk(W, H);
    const ctx = buf.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(source, region.x, region.y, region.w, region.h, 0, 0, W, H);
    const px = ctx.getImageData(0, 0, W, H).data;

    const N = W * H, g = new Float32Array(N);
    for (let i = 0, j = 0; i < N; i++, j += 4) g[i] = 0.299 * px[j] + 0.587 * px[j + 1] + 0.114 * px[j + 2];

    // Sobel magnitude; threshold at the 82nd percentile (min 30) so it adapts to dim or busy streams.
    const mag = new Float32Array(N);
    const hist = new Uint32Array(256);
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const i = y * W + x;
        const gx = g[i - W + 1] + 2 * g[i + 1] + g[i + W + 1] - g[i - W - 1] - 2 * g[i - 1] - g[i + W - 1];
        const gy = g[i + W - 1] + 2 * g[i + W] + g[i + W + 1] - g[i - W - 1] - 2 * g[i - W] - g[i - W + 1];
        const m = Math.min(255, Math.sqrt(gx * gx + gy * gy) / 4);
        mag[i] = m; hist[m | 0]++;
      }
    }
    let acc = 0, t = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= N * 0.82) { t = v; break; } }
    t = Math.max(30, t);

    // Binary edges, dilated once so a card's outline closes into one blob.
    const e0 = new Uint8Array(N), edge = new Uint8Array(N);
    for (let i = 0; i < N; i++) e0[i] = mag[i] >= t ? 1 : 0;
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const i = y * W + x;
        edge[i] = e0[i] | e0[i - 1] | e0[i + 1] | e0[i - W] | e0[i + W];
      }
    }

    // Connected components (8-way) -> bounding boxes.
    const label = new Int32Array(N), stack = new Int32Array(N);
    const boxes = [];
    let next = 1;
    for (let s = 0; s < N; s++) {
      if (!edge[s] || label[s]) continue;
      let sp = 0, x0 = W, y0 = H, x1 = 0, y1 = 0;
      stack[sp++] = s; label[s] = next;
      while (sp) {
        const i = stack[--sp], x = i % W, y = (i / W) | 0;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        for (let dy = -1; dy <= 1; dy++) {
          const yy = y + dy; if (yy < 0 || yy >= H) continue;
          for (let dx = -1; dx <= 1; dx++) {
            const xx = x + dx; if (xx < 0 || xx >= W) continue;
            const k = yy * W + xx;
            if (edge[k] && !label[k]) { label[k] = next; stack[sp++] = k; }
          }
        }
      }
      boxes.push({ x0, y0, x1, y1 });
      next++;
    }

    // Fraction of a box side that lies on edge pixels (within +-2 px across the side). Prefix sums
    // over edge maps smeared across each direction make every side test O(1), which is what lets
    // the window scan below try thousands of boxes per frame.
    const rowPS = new Int32Array((W + 1) * H), colPS = new Int32Array(W * (H + 1));
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        let v = 0; // horizontal sides: any edge within 2 px above or below
        for (let d = -2; d <= 2 && !v; d++) { const yy = y + d; if (yy >= 0 && yy < H && edge[yy * W + x]) v = 1; }
        rowPS[y * (W + 1) + x + 1] = rowPS[y * (W + 1) + x] + v;
      }
    }
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) {
        let v = 0; // vertical sides: any edge within 2 px left or right
        for (let d = -2; d <= 2 && !v; d++) { const xx = x + d; if (xx >= 0 && xx < W && edge[y * W + xx]) v = 1; }
        colPS[x * (H + 1) + y + 1] = colPS[x * (H + 1) + y] + v;
      }
    }
    const sideScore = (ax, ay, bx, by) => {
      ax = Math.max(0, Math.min(W - 1, ax)); bx = Math.max(0, Math.min(W - 1, bx));
      ay = Math.max(0, Math.min(H - 1, ay)); by = Math.max(0, Math.min(H - 1, by));
      if (ay === by) return (rowPS[ay * (W + 1) + bx + 1] - rowPS[ay * (W + 1) + ax]) / (bx - ax + 1);
      return (colPS[ax * (H + 1) + by + 1] - colPS[ax * (H + 1) + ay]) / (by - ay + 1);
    };

    // Counts straight edge lines running across the card's short side, inside its border
    // (rows for an upright card, columns for a tapped one). Adjacent hits count as one line.
    const innerLines = (x0, y0, w, h, tapped) => {
      const along = tapped ? w : h, across = tapped ? h : w;
      const a0 = Math.round(along * 0.06), a1 = Math.round(along * 0.94);
      const c0 = Math.round(across * 0.12), c1 = Math.round(across * 0.88), span = c1 - c0;
      let lines = 0, prev = -9;
      for (let a = a0; a < a1; a++) {
        let hit = 0;
        for (let c = c0; c < c1; c++) {
          const x = tapped ? x0 + a : x0 + c, y = tapped ? y0 + c : y0 + a;
          hit += edge[y * W + x];
        }
        if (hit / span >= 0.65) { if (a - prev > 2) lines++; prev = a; }
      }
      return lines;
    };

    // A box passes if it has card proportions and edges along all four sides.
    const testBox = (x0, y0, w, h) => {
      x0 = Math.round(x0); y0 = Math.round(y0); w = Math.round(w); h = Math.round(h);
      const long = Math.max(w, h), aspectErr = Math.abs(Math.min(w, h) / long - CARD) / CARD;
      if (long < H * minHeightFrac || long > H * maxHeightFrac || aspectErr > aspectTolerance) return null;
      const x1 = x0 + w - 1, y1 = y0 + h - 1;
      const sides = [sideScore(x0, y0, x1, y0), sideScore(x0, y1, x1, y1), sideScore(x0, y0, x0, y1), sideScore(x1, y0, x1, y1)];
      const mean = (sides[0] + sides[1] + sides[2] + sides[3]) / 4;
      if (Math.min(...sides) < minSideEdge || mean < minMeanSideEdge) return null;
      // Webcam boxes and people can be card-shaped; card faces aren't like them inside. Every TCG
      // layout has straight rules across the card (name bar, art box, text box), so require some.
      // Cards under ~60 analysis px (about 13% of the frame height) are too small to check.
      const lines = long >= 60 ? innerLines(x0, y0, w, h, w > h) : minInnerLines;
      if (lines < minInnerLines) return null;
      return { x0, y0, w, h, score: mean * (1 - aspectErr), rotated: w > h };
    };

    let cands = [];
    const debugBoxes = [];
    for (const b of boxes) {
      const w = b.x1 - b.x0 + 1, h = b.y1 - b.y0 + 1;
      if (Math.max(w, h) < H * minHeightFrac) continue;
      if (opts.debug) debugBoxes.push({ x0: b.x0, y0: b.y0, w, h });
      const whole = testBox(b.x0, b.y0, w, h);
      if (whole) { cands.push(whole); continue; }
      // Touching cards merge into one blob: try splitting it into a row or column of equal cards.
      const splits = [
        ['x', Math.round(w / (h * CARD))],  // upright cards side by side
        ['x', Math.round(w * CARD / h)],    // tapped cards side by side
        ['y', Math.round(h * CARD / w)],    // upright cards stacked
      ];
      for (const [axis, n] of splits) {
        if (n < 2 || n > 10) continue;
        const pieces = [];
        for (let k = 0; k < n; k++) {
          const c = axis === 'x' ? testBox(b.x0 + k * w / n, b.y0, w / n, h) : testBox(b.x0, b.y0 + k * h / n, w, h / n);
          if (c) pieces.push(c);
        }
        if (pieces.length) { cands.push(...pieces); break; }
      }
    }

    // Cards touching or overlapping merge into blobs no split can untangle. When the card size is
    // known (from opts.cardHeight, or from several clean detections), slide card-sized boxes over
    // the whole frame and keep those with strong straight edges on all four sides.
    const sizes = cands.map((c) => Math.max(c.w, c.h)).sort((a, b) => a - b);
    const hint = opts.cardHeight ? opts.cardHeight * W / region.w : sizes.length >= 3 ? sizes[sizes.length >> 1] : 0;
    if (hint >= H * minHeightFrac) {
      const found = [];
      for (const k of [0.92, 1, 1.08]) {
        const L = Math.round(hint * k), Sh = Math.round(L * CARD), step = Math.max(2, Math.round(L / 12));
        for (const [w, h] of [[Sh, L], [L, Sh]]) {
          for (let y0 = 0; y0 + h < H; y0 += step) {
            for (let x0 = 0; x0 + w < W; x0 += step) {
              const x1 = x0 + w - 1, y1 = y0 + h - 1;
              const a = sideScore(x0, y0, x1, y0), b = sideScore(x0, y1, x1, y1);
              if (a < scanMinSide || b < scanMinSide) continue;
              const c = sideScore(x0, y0, x0, y1), d = sideScore(x1, y0, x1, y1);
              if (c < scanMinSide || d < scanMinSide) continue;
              const mean = (a + b + c + d) / 4;
              if (mean >= scanMinMean) found.push({ x0, y0, w, h, score: mean, rotated: w > h });
            }
          }
        }
      }
      // Each card produces a cluster of nearby hits: refine each to its local best.
      found.sort((p, q) => q.score - p.score);
      for (const f of found) {
        if (cands.some((c) => iou(f, c) > 0.3)) continue;
        cands.push(f);
      }
    }

    // Drop boxes inside a better or bigger box (e.g. a card's art frame inside the card).
    cands.sort((a, b) => b.w * b.h - a.w * a.h);
    const kept = [];
    for (const c of cands) {
      if (kept.some((k) => overlap(c, k) > 0.6)) continue;
      kept.push(c);
    }
    const kx = region.w / W, ky = region.h / H;
    const out = kept.sort((a, b) => b.score - a.score).map((c) => ({
      x: region.x + c.x0 * kx, y: region.y + c.y0 * ky, w: c.w * kx, h: c.h * ky, score: c.score, rotated: c.rotated,
    }));
    // opts.debug: attach the edge map and boxes (analysis pixels) so a page can show what was seen.
    if (opts.debug) out.debug = { W, H, edge, blobs: debugBoxes, kept };
    return out;
  }

  // Share of a's area covered by b (boxes as {x0,y0,w,h} or {x,y,w,h}).
  function overlap(a, b) {

// ---- core/fingerprint.js ----
// Card Zoom core: picture fingerprints for recognising cards without reading their names.
// A card image is resized to 64x88 RGB, then described by
//   - a 64-bit perceptual hash of the art box (low-frequency DCT of a 32x32 greyscale copy),
//     which survives blur, small sizes and compression, and
//   - 66 bytes of colour layout (4x4 grid over the art, 2x3 over the whole card), normalised
//     so stream brightness and contrast matter less.
// The same code builds the index (Node, tools/build-index.mjs) and matches in the browser,
// so both sides compute identical fingerprints. Exposes window.CardZoom.fingerprint.

  'use strict';

  const FW = 64, FH = 88;                    // normalised card size
  const ART = { x0: 5, x1: 59, y0: 10, y1: 48 }; // art box of a modern frame, in 64x88 px

    if (!seenBefore && best.margin < STRONG_LEAD * maxDist && best.d > CLOSE_MATCH * maxDist) return false;
    namedOnStream.add(game + '|' + ix.meta[best.i][0]);
    // A close match with a wide lead settles the game on its own; a looser one needs a second.
    gameHits[game] += best.d <= CLOSE_MATCH * maxDist && best.margin >= STRONG_LEAD * maxDist ? 2 : 1;
    if (game === 'mtg' && ix.meta[best.i][4] != null) { seenFormats.set(ix.meta[best.i][0], ix.meta[best.i][4]); updateFormat(ix); }
    S.ids.set(t.id, { card: pictureCard(game, ix.meta[best.i]), flip: best.variant.flip, sig: M.signature(S.video, t.x, t.y, t.w, t.h) });
    return true;
  }
  return false;
}
function pictureCard(game, row) {
  if (game === 'mtg') {
    // Magic rows hold the Scryfall id; image URLs follow from it.
    const [name, set, num, sid] = row, path = `front/${sid[0]}/${sid[1]}/${sid}`;
    return { name, set: set.toUpperCase(), img: `https://cards.scryfall.io/normal/${path}.jpg`,
      big: `https://cards.scryfall.io/png/${path}.png`, link: `https://scryfall.com/card/${set}/${encodeURIComponent(num)}` };
  }
  const [name, set, num, img, big, link] = row;
  return { name, set: String(set).toUpperCase(), img, big: big || img, link };
}

// ---------- Cards drawn on the video ----------
// Drawing is safe only where it can't leak into the frames we analyse: a direct <video>, or a
// tab capture restricted to the video element.
const marksById = new Map();
function renderMarks() {
  const safe = S.kind === 'direct' || (S.kind === 'capture' && S.restricted);
  const live = new Set();
  if (safe && S.overlay) for (const t of S.tracks) {
    const id = S.ids.get(t.id);
    if (!id && !DEBUG) continue;
    live.add(t.id);
    let m = marksById.get(t.id);
    if (!m) {
      m = document.createElement('div');
      m.className = 'mark';
      m.innerHTML = '<img alt="" draggable="false"><button class="nc" title="Not a card">×</button>';
      m.onmouseenter = () => { S.hover = t.id; showPop(t.id); };
      m.onmouseleave = () => { if (S.hover === t.id) { S.hover = null; hidePop(); } };
      m.onclick = () => { const c = S.ids.get(t.id); if (c && c.card.link) window.open(c.card.link, '_blank', 'noopener'); };
      m.querySelector('.nc').onclick = (e) => { e.stopPropagation(); rejectTrack(t.id); };
      marks.appendChild(m); marksById.set(t.id, m);
    }
    const b = toStage(t);
    m.classList.toggle('debug', !id);
    if (DEBUG && !id) {
      const n = S.near.get(t.id);
      m.dataset.near = n ? `${n.name} ${n.d.toFixed(0)}/${n.maxDist.toFixed(0)} m${n.margin.toFixed(0)} (${S.tries.get(t.id) || 0})` : `not tried (${t.hits} hits)`;
    } else delete m.dataset.near;
    m.title = id ? `${id.card.name}${id.card.set ? ' (' + id.card.set + ')' : ''}` : '';
    m.style.cursor = id && id.card.link ? 'pointer' : 'default';
    Object.assign(m.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });
    const img = m.firstChild;
    if (id) {
      const src = id.card.img;
      if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; }
      // Turn the upright scan to lie like the card: by the trained detector's angle when there
      // is one (plus 180 degrees for cards facing the other player), else 90 for tapped cards.
      let sw = t.rotated ? b.h : b.w, sh = t.rotated ? b.w : b.h, turn = t.rotated ? 90 : 0;
      if (t.obb) { const k = b.w / t.w; sw = t.obb.cw * k; sh = t.obb.ch * k; turn = t.obb.angle + (id.flip || 0); }
      Object.assign(img.style, { display: 'block', width: sw + 'px', height: sh + 'px',
        left: (b.w - sw) / 2 + 'px', top: (b.h - sh) / 2 + 'px', transform: turn ? `rotate(${turn}deg)` : '' });
    } else img.style.display = 'none';
  }
  for (const [id, m] of marksById) if (!live.has(id)) { m.remove(); marksById.delete(id); }
  if (S.hover != null && !live.has(S.hover)) { S.hover = null; hidePop(); } else if (S.hover != null) showPop(S.hover);
}

// The hovered card, upright and big enough to read: up to 90% of the stage height, beside the
// card on whichever side has room, kept inside the stage.
function showPop(trackId) {
  const id = S.ids.get(trackId), m = marksById.get(trackId);
  if (!id || !m) return hidePop();
  const src = id.card.big || id.card.img;
  if (pop.dataset.src !== src) { pop.dataset.src = src; pop.src = src; pop.alt = id.card.name; }
  const r = stage.getBoundingClientRect(), b = { x: m.offsetLeft, y: m.offsetTop, w: m.offsetWidth, h: m.offsetHeight };
  const h = Math.min(r.height * 0.9, 700), w = h * 63 / 88, gap = 12;
  let x = b.x + b.w + gap;
  if (x + w > r.width) x = b.x - gap - w;
  if (x < 0) x = Math.max(0, Math.min(r.width - w, b.x + b.w / 2 - w / 2));
  const y = Math.max(0, Math.min(r.height - h, b.y + b.h / 2 - h / 2));
  Object.assign(pop.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  pop.classList.add('open');
}
function hidePop() { pop.classList.remove('open'); }

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.key.toLowerCase() === 'o') { S.overlay = !S.overlay; renderMarks(); status(S.overlay ? 'Cards shown.' : 'Cards hidden. Press O to show them again.'); }
});
window.addEventListener('resize', renderMarks);

// ---------- Demo table for trying it without a stream (?demo) ----------
if (params.has('demo')) {
  const c = document.createElement('canvas'); c.width = 1280; c.height = 720;
  const g = c.getContext('2d');
  const cards = [['Lightning Bolt', '#b03a2e', 260, 250, 0], ['Pikachu', '#d4ac0d', 520, 250, 0], ['Dark Magician', '#7d3c98', 800, 300, 1]];
  let f = 0;
  (function draw() {
    g.fillStyle = '#1d5c3a'; g.fillRect(0, 0, 1280, 720);
    cards.forEach(([n, col, x0, y0, tapped], i) => {
      const y = y0 + Math.sin((f + i * 20) / 30) * 6;
      g.save(); g.translate(x0, y);
      if (tapped) { g.translate(214, 0); g.rotate(Math.PI / 2); }
      g.fillStyle = '#111'; g.fillRect(-4, -4, 160, 222);
      g.fillStyle = col; g.fillRect(0, 0, 152, 214);
      g.fillStyle = '#f5f0e6'; g.fillRect(8, 8, 136, 22);
      g.fillStyle = '#111'; g.font = 'bold 14px serif'; g.fillText(n, 12, 24);
      g.fillStyle = '#ddd'; g.fillRect(8, 36, 136, 90);
      g.fillStyle = '#f5f0e6'; g.fillRect(8, 134, 136, 70);
      g.restore();
    });
    f++; requestAnimationFrame(draw);
  })();
  clearStage();
  const v = document.createElement('video');
  v.muted = true; v.autoplay = true; v.playsInline = true;
  v.srcObject = c.captureStream(30);
  useVideoElement(v);
  v.play();
  status('Demo table loaded. Its drawn cards are not real cards, so add ?debug to see what is spotted.');
}
})();

</script>

  document.getElementById('load').onclick = () => alert('This copy of the page is missing its script files (core/ and web/). Open card-zoom.html, which has everything in one file.');
}
</script>
