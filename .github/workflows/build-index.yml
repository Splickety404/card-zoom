name: Build card picture indexes

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # weekly, to pick up new sets
  push:
    branches: [main]
    paths: ['core/fingerprint.js', 'tools/build-index.mjs']

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save sharp@0.33.5
      # One index per game; a game whose database is down keeps last week's index.
      - run: node tools/build-index.mjs mtg
        continue-on-error: true
      - run: node tools/build-index.mjs pokemon
        continue-on-error: true
      - run: node tools/build-index.mjs lorcana
        continue-on-error: true
      - run: node tools/build-index.mjs yugioh
        continue-on-error: true
      - run: node tools/build-index.mjs swu
        continue-on-error: true
      - run: node tools/build-index.mjs fab
        continue-on-error: true
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update card picture indexes"
          git pull --rebase origin main
          git push origin HEAD:main
